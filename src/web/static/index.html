<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGOX Dashboard</title>
    <link rel="icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinia@2/dist/pinia.iife.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-chartjs@5"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0d1117; color: #e6edf3; }
        .sidebar { width: 260px; background: #161b22; height: 100vh; position: fixed; left: 0; top: 0; border-right: 1px solid #30363d; z-index: 100; transition: transform 0.3s; }
        .sidebar.collapsed { transform: translateX(-100%); }
        .main { margin-left: 260px; min-height: 100vh; transition: margin-left 0.3s; }
        .main.expanded { margin-left: 0; }
        .topbar { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .content { padding: 2rem; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
        .stat-card { background: linear-gradient(135deg, #1f6feb 0%, #8b5cf6 100%); color: white; }
        .btn-primary { background: linear-gradient(135deg, #1f6feb 0%, #8b5cf6 100%); border: none; color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .table-dark { color: #e6edf3; }
        .table-dark th { border-color: #30363d; }
        .table-dark td { border-color: #30363d; }
        .sidebar-nav { padding: 1rem; }
        .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 6px; color: #8b949e; text-decoration: none; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: #1f6feb; color: white; }
        .nav-item i { width: 20px; text-align: center; }
        .toggle-btn { background: none; border: none; color: #8b949e; font-size: 1.25rem; }
        .toggle-btn:hover { color: white; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" :class="{ collapsed: sidebarCollapsed, open: sidebarOpen }" ref="sidebar">
            <div class="sidebar-header d-flex align-items-center justify-content-between p-3 border-bottom border-secondary">
                <h4 class="mb-0 fw-bold" style="background: linear-gradient(135deg, #1f6feb 0%, #8b5cf6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AEGOX Dashboard</h4>
                <button class="toggle-btn" @click="toggleSidebar" v-if="sidebarCollapsed"><i class="bi bi-chevron-right"></i></button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" @click.prevent="navigate('/')"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="#" class="nav-item" @click.prevent="navigate('/clans')"><i class="bi bi-people-fill"></i> Clanes</a>
                <a href="#" class="nav-item" @click.prevent="navigate('/tickets')"><i class="bi bi-ticket-perforated"></i> Tickets</a>
                <a href="#" class="nav-item" @click.prevent="navigate('/analytics')"><i class="bi bi-graph-up"></i> Analytics</a>
                <a href="#" class="nav-item" @click.prevent="navigate('/anti-alt')"><i class="bi bi-shield-lock"></i> Anti-Alt</a>
                <a href="#" class="nav-item" @click.prevent="navigate('/tickets')"><i class="bi bi-ticket-perforated"></i> Tickets</a>
                <a href="#" class="nav-item" @click.prevent="navigate('/announcements')"><i class="bi bi-megaphone"></i> Anuncios</a>
                <a href="#" class="nav-item" @click.prevent="navigate('/giveaways')"><i class="bi bi-gift"></i> Sorteos</a>
                <a href="#" class="nav-item" @click.prevent="navigate('/settings')"><i class="bi bi-gear"></i> Configuración</a>
            </nav>
            <div class="sidebar-footer p-3 border-top border-secondary">
                <div class="d-flex align-items-center gap-2">
                    <div class="avatar bg-gradient text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">{{ userInitial }}</div>
                    <div>
                        <div class="fw-bold text-white small">{{ userName }}</div>
                        <div class="text-muted small">Owner</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Mobile toggle -->
        <button class="btn btn-primary toggle-btn d-md-none position-fixed" style="top: 1rem; left: 1rem; z-index: 200;" @click="sidebarOpen = !sidebarOpen">
            <i class="bi bi-list"></i>
        </button>

        <!-- Main Content -->
        <main class="main" :class="{ expanded: sidebarCollapsed }">
            <header class="topbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="toggle-btn d-md-none" @click="sidebarOpen = true"><i class="bi bi-list"></i></button>
                    <h1 class="h4 mb-0 fw-bold">{{ pageTitle }}</h1>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2" data-bs-toggle="dropdown">
                            <div class="avatar bg-gradient text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">{{ userInitial }}</button>
                        </div>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-person"></i> Perfil</a></li>
                            <li><a class="dropdown-item" href="#"><i class="bi bi-gear"></i> Configuración</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a></li>
                        </ul>
                    </div>
                </div>
            </header>
            <div class="content">
                <router-view></router-view>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, provide, inject } = Vue;
        const { createRouter, createWebHashHistory } = VueRouter;
        const { createPinia } = Pinia;

        // Pinia store
        const { defineStore } = Pinia;
        const useAuthStore = defineStore('auth', {
            state: () => ({
                user: null,
                token: localStorage.getItem('token') || '',
                guildId: parseInt(localStorage.getItem('guildId')) || 0
            }),
            actions: {
                setAuth(user, token, guildId) {
                    this.user = user;
                    this.token = token;
                    this.guildId = guildId;
                    localStorage.setItem('token', token);
                    localStorage.setItem('guildId', guildId);
                },
                logout() {
                    this.user = null;
                    this.token = '';
                    this.guildId = 0;
                    localStorage.removeItem('token');
                    localStorage.removeItem('guildId');
                }
            }
        });

        const useUIStore = defineStore('ui', {
            state: () => ({
                sidebarCollapsed: false,
                sidebarOpen: false,
                pageTitle: 'Dashboard'
            })
        });

        // Router
        const routes = [
            { path: '/', component: Dashboard },
            { path: '/clans', component: Clans },
            { path: '/tickets', component: Tickets },
            { path: '/analytics', component: Analytics },
            { path: '/anti-alt', component: AntiAlt },
            { path: '/tickets', component: Tickets },
            { path: '/announcements', component: Announcements },
            { path: '/giveaways', component: Giveaways },
            { path: '/settings', component: Settings }
        ];
        const router = createRouter({ history: createWebHashHistory(), routes });

        // Components
        const Dashboard = {
            template: `
                <div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-3"><div class="card stat-card"><div class="card-body"><h6>Usuarios Activos (24h)</h6><h2 class="mb-0">{{ stats.dau }}</h6></div></div>
                        <div class="col-md-3"><div class="card stat-card"><div class="card-body"><h6>Comandos (24h)</h6><h2 class="mb-0">{{ stats.commands }}</h6></div></div>
                        <div class="col-md-3"><div class="card stat-card"><div class="card-body"><h6>Tickets Abiertos</h6><h2 class="mb-0">{{ stats.openTickets }}</h6></div></div>
                        <div class="col-md-3"><div class="card stat-card"><div class="card-body"><h6>Detecciones Anti-Alt</h6><h2 class="mb-0">{{ stats.antiAlt }}</h2></div></div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6"><div class="card"><div class="card-header"><h5>Comandos Recientes</h5></div><div class="card-body"><div class="table-responsive"><table class="table table-dark table-hover"><thead><tr><th>Comando</th><th>Usos</th></tr></thead><tbody><tr v-for="cmd in recentCommands"><td>{{ cmd.command }}</td><td>{{ cmd.count }}</td></tr></tbody></table></div></div></div>
                        <div class="col-md-6"><div class="card"><div class="card-header"><h5>Detecciones Anti-Alt</h5></div><div class="card-body"><div class="table-responsive"><table class="table table-dark table-hover"><thead><tr><th>Nivel</th><th>Cantidad</th></tr></thead><tbody><tr v-for="d in antiAlt"><td><span class="badge" :class="badgeClass(d.level)">{{ d.level }}</span></td><td>{{ d.count }}</td></tr></tbody></table></div></div></div>
                    </div>
                </div>
            `,
            setup() {
                const analytics = inject('analytics');
                const stats = ref({ dau: 0, commands: 0, openTickets: 0, antiAlt: 0 });
                const recentCommands = ref([]);
                const antiAlt = ref([]);
                
                onMounted(async () => {
                    try {
                        const [summary, commands, antiAltData] = await Promise.all([
                            axios.get('/api/analytics/summary?period=24h', { headers: authHeader() }),
                            axios.get('/api/analytics/events?event_type=command_used&limit=5', { headers: authHeader() }),
                            axios.get('/api/analytics/summary?period=24h', { headers: authHeader() })
                        ]);
                        stats.value = summary.data;
                        recentCommands.value = commands.data.events || [];
                        antiAlt.value = antiAltData.data.anti_alt || [];
                    } catch (e) { console.error(e); }
                });
                
                return { stats, recentCommands, antiAlt };
            }
        },
        Clans: { template: '<div class="card"><div class="card-header d-flex justify-content-between"><h5>Clanes</h5><button class="btn btn-primary" @click="showCreateModal = true"><i class="bi bi-plus"></i> Crear Clan</button></div><div class="card-body"><div class="table-responsive"><table class="table table-dark table-hover"><thead><tr><th>Nombre</th><th>Tag</th><th>Owner</th><th>Miembros</th><th>Acciones</th></tr></thead><tbody><tr v-for="clan in clans"><td>{{ clan.name }}</td><td>{{ clan.tag }}</td><td>{{ clan.owner_id }}</td><td>{{ clan.member_count || 0 }}</td><td><button class="btn btn-sm btn-outline-primary" @click="editClan(clan)"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger" @click="deleteClan(clan.id)"><i class="bi bi-trash"></i></button></td></tr></tbody></table></div></div></div>', setup() { const clans = ref([]); onMounted(async () => { try { const res = await axios.get('/api/clans', { headers: authHeader() }); clans.value = res.data.clans || []; } catch (e) { console.error(e); } }); return { clans }; } }),
            // ... más componentes
        };

        const app = createApp({});
        app.use(createPinia());
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
